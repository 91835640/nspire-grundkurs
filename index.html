<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Nspire-Grundkurs</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f4f5f8; --surface:#ffffff; --surface-2:#eef0f5; --border:#dde1ea;
    --text:#1b2030; --text-dim:#6b7285; --accent:#3159e0; --accent-ink:#ffffff;
    --good:#1a8a52; --good-bg:#e7f6ee; --bad:#c23a3a; --bad-bg:#fcebea;
    --shadow:0 1px 2px rgba(20,24,40,.06), 0 4px 14px rgba(20,24,40,.05);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#11131c; --surface:#181b27; --surface-2:#1f2330; --border:#2b2f40;
      --text:#e9ebf3; --text-dim:#9aa3ba; --accent:#7fa0ff; --accent-ink:#0d1020;
      --good:#5fd394; --good-bg:#153226; --bad:#ff8a80; --bad-bg:#3a1c1c;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#11131c; --surface:#181b27; --surface-2:#1f2330; --border:#2b2f40;
    --text:#e9ebf3; --text-dim:#9aa3ba; --accent:#7fa0ff; --accent-ink:#0d1020;
    --good:#5fd394; --good-bg:#153226; --bad:#ff8a80; --bad-bg:#3a1c1c;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.5;
  }
  img{max-width:100%;}
  [hidden]{display:none!important;}
  code,.mono{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  button{font-family:inherit;}

  #app{max-width:720px; margin:0 auto; padding:18px 16px 40px;}

  /* ---------- header with calculator logo ---------- */
  .apphead{display:flex; align-items:center; gap:14px; margin:4px 0 20px;}
  .apphead .logo{flex:0 0 auto;}
  .apphead .logo svg{display:block; width:40px; height:55px; filter:drop-shadow(0 3px 6px rgba(20,24,40,.18));}
  h1.appTitle{font-size:22px; font-weight:800; margin:0 0 2px;}
  p.appSub{color:var(--text-dim); font-size:13.5px; margin:0;}

  /* ---------- reference card (prominent) ---------- */
  .refcard{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left; color:var(--text);
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--accent);
    border-radius:14px; padding:14px 16px; cursor:pointer; box-shadow:var(--shadow); margin-bottom:24px;
  }
  .refcard:hover{border-color:var(--accent);}
  .refcard .ri{font-size:24px; flex:0 0 auto;}
  .refcard .rtxt{flex:1 1 auto; display:flex; flex-direction:column; gap:2px;}
  .refcard .rt{font-weight:700; font-size:15px;}
  .refcard .rs{font-size:12.5px; color:var(--text-dim);}
  .refcard .lvl-arrow{color:var(--accent);}
  .sectionlabel{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-dim); margin:0 0 9px 2px;
  }

  /* ---------- level grid ---------- */
  .levelgrid{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .lvl-btn{
    display:flex; align-items:center; gap:14px; text-align:left;
    border:1px solid var(--border); border-radius:14px; background:var(--surface);
    padding:15px 16px; cursor:pointer; box-shadow:var(--shadow); width:100%; color:var(--text);
  }
  .lvl-btn:hover{border-color:var(--dot);}
  .lvl-dot{
    width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    background:var(--dot); color:#fff; font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center;
  }
  .lvl-info{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:3px;}
  .lvl-name{font-weight:700; font-size:14.5px; line-height:1.3;}
  .lvl-status{font-size:12.5px; color:var(--text-dim);}
  .lvl-arrow{color:var(--text-dim); font-size:18px; flex:0 0 auto;}
  .lvl-btn.mixed{border-style:dashed;}


  /* ---------- level screen: tabs ---------- */
  .levelheader{font-weight:800; font-size:19px; margin-bottom:14px;}
  .tabbar{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{
    flex:1 1 auto; text-align:center; padding:10px 14px; border-radius:10px;
    border:1px solid var(--border); background:var(--surface); color:var(--text-dim);
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .tab-btn.active{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}

  .theorypane{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow); font-size:14.5px;
  }
  .theorypane p{margin:.6em 0;}
  .theorypane ul,.theorypane ol{margin:.5em 0; padding-left:1.3em;}
  .theorypane li{margin:.25em 0;}
  figure.fig{margin:.8em 0;}
  figure.fig img{
    max-width:min(100%,440px); display:block; border-radius:8px; border:1px solid var(--border); background:#fff;
    box-shadow:var(--shadow);
  }
  figure.fig figcaption{font-size:11.5px; color:var(--text-dim); margin-top:6px;}

  /* recreated calculator display: input blue, result green (like on the Nspire) */
  .calc{
    background:#fff; color:#1b2030; border:1px solid var(--border); border-radius:10px;
    box-shadow:var(--shadow); padding:8px 14px; margin:.7em 0; max-width:100%; overflow-x:auto;
    font-family:"Cambria Math","Times New Roman",Georgia,serif; font-size:16.5px;
  }
  .calc .ln{display:flex; flex-wrap:wrap; align-items:center; column-gap:12px; row-gap:2px; padding:5px 0;}
  .calc .ln + .ln{border-top:1px dashed #e3e6ee;}
  .calc .in{color:#1f3fc4;}
  .calc .out{color:#16833f; display:inline-flex; align-items:center;}
  .calc .out::before{content:"\25B8"; font-size:.7em; margin-right:7px;}
  .calc .k{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:11px; color:#6b7285;
    border:1px solid #d5d9e2; border-radius:4px; padding:0 4px; margin-left:6px; white-space:nowrap;
  }
  .frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-size:.85em; line-height:1.1; margin:0 1px;}
  .frac > span:first-child{border-bottom:1px solid currentColor; padding:0 2px;}
  /* tall brackets drawn as SVG so they stretch over a two-line system, like on the calculator */
  .grp, .sys{display:inline-flex; align-items:center; vertical-align:middle;}
  .grp > .brk, .sys > .brk{align-self:stretch;}
  .brk{width:.42em; height:auto; min-height:1.4em; flex:0 0 auto; overflow:visible;}
  .brk.br{width:.5em;}
  .ph{display:inline-block; width:.95em; height:1.2em; border:1.3px dashed currentColor; border-radius:2px; margin:2px 0; vertical-align:middle;}
  ol.steps{padding-left:1.4em;}
  ol.steps > li > figure.fig{margin:.6em 0 .2em;}
  ol.steps > li > p{margin:.5em 0;}
  img.inlinekey{display:inline-block; height:1.4em; width:auto; vertical-align:middle; border:1px solid var(--border); border-radius:5px; margin:0 2px;}
  .figpair{display:flex; flex-wrap:wrap; gap:14px; margin:.6em 0;}
  .figpair figure.fig{margin:0; flex:1 1 220px; max-width:330px;}
  .shot{position:relative; display:inline-block; max-width:100%;}
  .shot img{max-width:100% !important;}
  .ring{position:absolute; border:3px solid #f0a020; border-radius:9px; box-shadow:0 0 0 2px rgba(255,255,255,.7); pointer-events:none;}
  .tip > .calc:last-child{margin-bottom:2px;}
  ol.steps > li{margin:.3em 0 .9em;}
  ol.steps > li > .calc{margin:.5em 0 0;}
  .sysrows{display:flex; flex-direction:column; justify-content:center; line-height:1.35; font-size:.92em; padding:2px 3px 2px 1px;}
  .vec{
    display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
    border-left:1.5px solid currentColor; border-right:1.5px solid currentColor; border-radius:3px;
    padding:1px 6px; line-height:1.25; font-size:.9em; margin:0 2px;
  }
  /* recreated key palettes */
  .pal{
    display:inline-grid; border:1px solid #cfd3dc; border-radius:8px; overflow:hidden;
    background:#fff; box-shadow:var(--shadow);
  }
  .pal span{
    min-width:42px; height:38px; padding:0 8px; display:flex; align-items:center; justify-content:center;
    font-size:18px; color:#1b2030; border-right:1px solid #e3e6ee; border-bottom:1px solid #e3e6ee;
    font-family:"Cambria Math","Times New Roman",Georgia,serif;
  }
  .pal.small span{font-size:14px; height:32px;}
  .pal span.on{background:#2a78d4; color:#fff;}
  .theorypane h4{font-size:15.5px; margin:1.5em 0 .3em;}
  .theorypane h4:first-child{margin-top:0;}
  /* collapsible sections in the Erklärungen tab */
  .secttools{display:flex; justify-content:space-between; margin:-6px 0 6px;}
  .secttools button{background:none; border:none; color:var(--accent); font-weight:600; font-size:13px; cursor:pointer; padding:4px 0;}
  details.sect + details.sect{border-top:1px solid var(--border);}
  details.sect > summary{
    list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 2px; font-weight:700; font-size:15.5px;
  }
  details.sect > summary::-webkit-details-marker{display:none;}
  details.sect > summary::after{
    content:"›"; color:var(--text-dim); font-size:20px; line-height:1; transform:rotate(90deg); transition:transform .15s; flex:0 0 auto;
  }
  details.sect[open] > summary::after{transform:rotate(-90deg);}
  details.sect > summary:hover{color:var(--accent);}
  details.sect > .sbody{padding:0 2px 16px;}
  details.sect > .sbody > :first-child{margin-top:0;}
  .theorypane .tip{background:var(--surface-2); border-radius:8px; padding:8px 12px; font-size:14px;}
  table.legend{border-collapse:collapse; font-size:13.5px; margin:.6em 0;}
  table.legend td{padding:3px 12px 3px 0; vertical-align:top;}
  table.legend td:first-child{font-weight:700; white-space:nowrap; font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  table.legend.keys td:first-child{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; font-weight:600; font-size:12.5px; width:11.5em;}

  /* keycaps for keys and menu paths */
  .keyseq{display:inline-flex; align-items:center; flex-wrap:nowrap; gap:3px; vertical-align:middle; margin:1px 0;}
  .kwrap{white-space:nowrap;}
  kbd.key{
    display:inline-flex; align-items:center; justify-content:center; min-width:1.75em; height:1.6em; padding:0 .45em;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:.8em; font-weight:700; line-height:1;
    color:var(--text); background:var(--surface); border:1px solid var(--border); border-bottom-width:2.5px; border-radius:6px;
    white-space:nowrap;
  }
  kbd.key.word{color:var(--accent);}
  .keyseq .ksep{color:var(--text-dim); font-size:.85em; margin:0 1px;}
  .keyseq .kplain{color:var(--text-dim); font-size:.9em; margin:0 2px;}
  .exlist{display:flex; flex-direction:column; gap:14px;}
  .mixbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:14px; font-size:13.5px; color:var(--text-dim);}
  .qcard{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:20px; box-shadow:var(--shadow); transition:background .25s, border-color .25s;
  }
  .qcard.flash-bad{background:var(--bad-bg);}
  .qcard.solved{background:var(--good-bg); border-color:var(--good);}
  .qbadge{
    font-size:11px; font-weight:700; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.04em; margin-bottom:8px;
  }
  .qbadge .check{color:var(--good); margin-left:6px; text-transform:none; letter-spacing:0;}
  .qtext{font-size:16.5px; margin:0 0 12px;}
  .qrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .qrow input[type=text]{
    flex:1 1 220px; min-width:160px; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:15px; padding:10px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text);
  }
  .qrow input[type=text]:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .qrow input[type=text]:disabled{opacity:.7;}
  button.cta{
    font-weight:700; font-size:14px; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:10px; padding:10px 18px; cursor:pointer; flex:0 0 auto;
  }
  button.cta:disabled{opacity:.5; cursor:default;}
  button.cta.secondary{background:var(--surface-2); color:var(--text); border:1px solid var(--border);}
  button.linklike{
    background:none; border:none; color:var(--text-dim); text-decoration:underline; font-size:12.5px;
    cursor:pointer; padding:0;
  }
  .hintbox{
    margin-top:10px; font-size:13.5px; background:var(--surface-2); border-radius:8px; padding:8px 11px;
  }
  .feedback{margin-top:14px; display:none; font-size:14.5px;}
  .feedback.show{display:block;}
  .feedback .tag-good{color:var(--good); font-weight:700;}
  .feedback .tag-bad{color:var(--bad); font-weight:700;}
  .feedback .explain{display:block; margin-top:4px; color:var(--text-dim); font-size:13.5px;}
  .feedback-actions{margin-top:12px; display:flex; gap:8px;}


  /* ---------- search ---------- */
  .searchbox{position:relative; margin-bottom:16px;}
  .searchbox input{
    width:100%; font-size:16px; padding:13px 40px 13px 42px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--text); box-shadow:var(--shadow);
    font-family:inherit; -webkit-appearance:none; appearance:none;
  }
  .searchbox input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .searchbox .sicon{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-dim); pointer-events:none;}
  .searchbox .sclear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none;
    color:var(--text-dim); font-size:20px; line-height:1; padding:6px 8px; cursor:pointer;
  }
  .results{display:flex; flex-direction:column; gap:8px;}
  .res{
    display:block; width:100%; text-align:left; color:var(--text); cursor:pointer;
    background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--dot);
    border-radius:12px; padding:11px 14px; box-shadow:var(--shadow);
  }
  .res:hover{border-color:var(--dot);}
  .res .rmeta{font-size:11.5px; color:var(--text-dim); font-weight:600; margin-bottom:2px;}
  .res .rtitle{font-weight:700; font-size:14.5px;}
  .res .rsnip{font-size:13px; color:var(--text-dim); margin-top:3px; line-height:1.45;}
  .res mark, .rtitle mark{background:rgba(255,200,0,.35); color:inherit; border-radius:3px; padding:0 1px;}
  .noresults{color:var(--text-dim); font-size:14px; padding:10px 2px;}
  @keyframes flashbg{0%{background:rgba(255,200,0,.45);} 100%{background:transparent;}}
  .flash-target{animation:flashbg 2.2s ease-out; border-radius:6px;}

  .tools-l, .tools-r{display:inline-flex; align-items:center; gap:14px;}
  a.pdflink{color:var(--accent); font-weight:600; font-size:13px; text-decoration:none;}
  a.pdflink:hover{text-decoration:underline;}
  button.seelink{background:none; border:0; padding:0; font:inherit; font-size:12.5px; font-weight:600; color:var(--accent); cursor:pointer; white-space:nowrap;}
  @media print{ button.seelink{font-size:9.5px; color:#1b2030;} }
  button.seelink:hover{text-decoration:underline;}
  a.reflink.pdflink{font-size:13.5px; font-weight:700; padding:9px 14px; border:1px solid var(--border); border-radius:10px; text-decoration:none;}
  .printhead{display:none;}
  .backtaskbar{position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px)); z-index:30;}
  .backtaskbar .cta{box-shadow:var(--shadow);}
  /* ---------- back to exercise, exercise cards ---------- */
  .exintro{font-size:13.5px; color:var(--text-dim); margin:0 0 12px;}
  .qhead{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .qnew{background:none; border:1px solid var(--border); border-radius:8px; color:var(--accent); font-size:12px; font-weight:600; padding:3px 9px; cursor:pointer; white-space:nowrap; margin-top:-3px;}
  .qnew:hover{border-color:var(--accent);}
  .qlinks{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap;}
  .feedback .tag-sol{color:var(--accent); font-weight:700;}
  .feedback .explain.sol{color:var(--text);}
  button.cta.small{font-size:13px; padding:7px 12px;}
  /* ---------- start screen extras ---------- */
  .lvl-desc{font-size:12.5px; color:var(--text-dim); line-height:1.35;}
  .lvl-status{font-size:11.5px;}
  /* ---------- Spick ---------- */
  .spickhead{display:flex; align-items:center; gap:12px; margin-bottom:14px;}
  .spickhead .logo svg{width:30px; height:41px; display:block;}
  .spickhead .levelheader{margin:0;}
  .spick{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(300px,100%), 1fr)); gap:12px;}
  .spsec{margin-top:22px;}
  .palrow{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start;}
  .palrow figure.fig{margin:0;}
  .spbox{position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px 10px 16px; box-shadow:var(--shadow);}
  .spbox::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--dot);}
  .spbox h3{font-size:13.5px; margin:0 0 6px; display:flex; align-items:center; gap:8px;}
  .lvl-dot.sm{width:20px; height:20px; font-size:11px; border-radius:6px; background:var(--dot);}
  .spbox table{border-collapse:collapse; width:100%; font-size:12.5px;}
  .spbox td{padding:3px 0; vertical-align:middle;}
  .spbox td:last-child{text-align:right; padding-left:8px; white-space:nowrap;}
  .spbox .keyseq{flex-wrap:nowrap;}
  .spbox tr + tr td{border-top:1px dashed var(--border);}
  /* ---------- print ---------- */
  @media print{
    :root, :root:not([data-theme="light"]), :root[data-theme="dark"]{
      --bg:#fff; --surface:#fff; --surface-2:#f1f2f6; --border:#c9ced8; --text:#111; --text-dim:#555;
      --accent:#2a4fd0; --good:#1a7a48; --bad:#b03030; --shadow:none;
    }
    body{background:#fff;}
    #app{max-width:none; padding:0;}
    .backbar, .tabbar, .secttools, .backtaskbar, .searchbox, .mixbar, .qrow, .qlinks, .qnew,
    .hintbox, .feedback, .exintro{display:none !important;}
    .theorypane{border:none; box-shadow:none; padding:0;}
    details.sect > summary::after{display:none;}
    figure, .calc, .pal, .qcard, .spbox, tr{break-inside:avoid;}
    .qcard{box-shadow:none;}
    .spick{grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px;}
    .refpal{display:none !important;}
    .printhead{display:block; font-size:10px; color:#555; margin-bottom:4px;}
    figure.fig img{max-width:min(100%,250px) !important;}
    .figpair figure.fig{max-width:250px;}
    figure.fig{margin:.4em 0;}
    .theorypane{font-size:13px;}
    .calc{font-size:14.5px; padding:5px 12px; margin:.4em 0;}
    details.sect > summary{padding:8px 0; font-size:14px; color:var(--text) !important; break-after:avoid; page-break-after:avoid;}
    details.sect > .sbody{padding-bottom:8px;}
    .theorypane p{margin:.4em 0;}
    .flash-target{animation:none !important; background:none !important;}
    .sectionlabel{margin:10px 0 6px;}
    .spsec{margin-top:12px;}
    .spbox{padding:6px 8px 6px 11px; border-color:#c5cad6; box-shadow:none;}
    .spbox table{font-size:9.5px;}
    .spbox td{padding:1px 0;}
    .spbox h3{font-size:11px; margin:0 0 3px;}
    .spickhead{margin-bottom:6px;}
    .spickhead .levelheader{font-size:16px;}
    kbd.key{font-size:.75em; height:1.45em;}
    kbd.key{border-color:#999;}
    .lvl-dot, .pal span.on, .spbox, .theorypane .tip{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
  .backbar{margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .backbar .reflink{
    background:none; border:1px solid var(--border); border-radius:10px; color:var(--accent);
    font-weight:700; font-size:13.5px; padding:9px 14px; cursor:pointer;
  }
  .backbar .reflink:hover{border-color:var(--accent);}
</style>

<div id="app"></div>

<script>
(function(){
  "use strict";

  /* ================= small builders for recreated calculator displays ================= */
  function fr(n, d){ return '<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>'; }
  function brk(kind){
    var d = {"(":"M8 1 C1.5 12 1.5 28 8 39", ")":"M2 1 C8.5 12 8.5 28 2 39",
             "{":"M9 1 C5 1 5 3.5 5 8 L5 15.5 C5 18.5 3.2 20 1 20 C3.2 20 5 21.5 5 24.5 L5 32 C5 36.5 5 39 9 39"}[kind];
    return '<svg class="brk'+(kind === "{" ? ' br' : '')+'" viewBox="0 0 10 40" preserveAspectRatio="none" aria-hidden="true">'+
           '<path d="'+d+'" fill="none" stroke="currentColor" stroke-width="1.3" vector-effect="non-scaling-stroke"/></svg>';
  }
  function sys(eqs){ return '<span class="sys">'+brk("{")+'<span class="sysrows">'+eqs.map(function(e){ return '<span>'+e+'</span>'; }).join('')+'</span></span>'; }
  /* solve( {system} ,{vars} ) with tall round brackets around everything */
  function solveSys(eqs, vars){ return 'solve<span class="grp">'+brk("(")+sys(eqs)+',{'+vars+'}'+brk(")")+'</span>'; }
  function vec(items){ return '<span class="vec">'+items.map(function(v){ return '<span>'+v+'</span>'; }).join('')+'</span>'; }
  function calc(lines){
    return '<div class="calc">'+lines.map(function(l){
      return '<div class="ln"><span class="in">'+l[0]+'</span>'+(l[1]!=null ? '<span class="out">'+l[1]+'</span>' : '')+'</div>';
    }).join('')+'</div>';
  }
  function palette(keys, cols, active, extraClass, caption){
    var html = '<figure class="fig"><div class="pal'+(extraClass?' '+extraClass:'')+'" style="grid-template-columns:repeat('+cols+',auto)">';
    keys.forEach(function(k, i){ html += '<span'+(i===active?' class="on"':'')+'>'+k+'</span>'; });
    return html + '</div>'+(caption ? '<figcaption>'+caption+'</figcaption>' : '')+'</figure>';
  }
  function ineqPalette(active, caption){ return palette(['&gt;','&lt;','≠','≥','≤','|'], 3, active, '', caption); }
  function trigPalette(){
    return palette(['sin','cos','tan','csc','sec','cot','sin⁻¹','cos⁻¹','tan⁻¹','csc⁻¹','sec⁻¹','cot⁻¹'], 6, -1, 'small', 'Palette der Taste trig');
  }

  function normText(s){
    return String(s).toLowerCase().trim()
      .replace(/\s+/g,"")
      .replace(/[×·]/g,"*")

      .replace(/\^2/g,"²");

  /* multi: several values expected -> commas separate values ("5,2,1"); otherwise a comma is a decimal comma ("1,667") */
  function extractNumbers(s, multi){
    var t = String(s).replace(/[−–]/g,"-");
    /* multiples of pi: "π/3", "5π/3", "5·π/6", "-pi/2" -> decimal value */
    t = t.replace(/(-?)(\d+(?:\.\d+)?)?\s*[*·×]?\s*(?:π|pi(?![a-z]))(?:\s*\/\s*(\d+(?:\.\d+)?))?/gi, function(_, sign, coef, den){
      var v = (coef ? Number(coef) : 1) * Math.PI / (den ? Number(den) : 1);
      return " " + (sign ? -v : v) + " ";
    });
    t = multi ? t.replace(/,/g," ; ") : t.replace(/(\d),(\d)/g,"$1.$2");
    var m = t.match(/-?\d+(?:\.\d+)?(?:\s*\/\s*-?\d+(?:\.\d+)?)?/g);
    if(!m) return [];
    return m.map(function(tok){
      var parts = tok.split("/");
      if(parts.length === 2){
        var d = Number(parts[1]);
        return d === 0 ? NaN : Number(parts[0]) / d;
      }
      return Number(tok);
    }).filter(function(n){ return !isNaN(n); });
  }

    if(!nums.length) return false;
    return correctList.every(function(c){
      return nums.some(function(n){ return Math.abs(n - c) < tol; });
    });
  }
  function checkAnswer(ex, raw){
    if(ex.type === "numeric"){ return checkNumericAnswer(raw, ex.correct, ex.tol || 0.01); }
    return checkTextAnswer(raw, ex.accept);
  }

  /* ================= helpers ================= */
  function exercisesForLevel(levelId){
    return EXERCISES.filter(function(e){ return e.level === levelId; });
  }
  function levelTitle(levelId){
    if(levelId === "mixed") return "Gemischt: Alle Themenbereiche";
    var L = LEVELS.filter(function(x){ return x.id===levelId; })[0];
    return L ? L.title : "";
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }
  var MIXED_COUNT = 20;
  /* new random mix: at least one task per Themenbereich, MIXED_COUNT in total, shown in topic order */
  function newMixedSet(){
    var chosen = {};
    LEVELS.forEach(function(L){
      var pool = exercisesForLevel(L.id);
      if(pool.length) chosen[pool[Math.floor(Math.random()*pool.length)].id] = true;
    });
    var rest = EXERCISES.filter(function(e){ return !chosen[e.id]; });
    for(var i = rest.length-1; i > 0; i--){
      var j = Math.floor(Math.random()*(i+1)); var t = rest[i]; rest[i] = rest[j]; rest[j] = t;
    }
    var need = Math.min(MIXED_COUNT, EXERCISES.length) - Object.keys(chosen).length;
    rest.slice(0, Math.max(0, need)).forEach(function(e){ chosen[e.id] = true; });
    var ordered = [];
    LEVELS.forEach(function(L){ exercisesForLevel(L.id).forEach(function(e){ if(chosen[e.id]) ordered.push(e.id); }); });
    state.mixedSet = ordered;
    [state.answers, state.variants, state.tries, state.revealed].forEach(function(store){
      Object.keys(store).forEach(function(k){ if(k.indexOf("m:") === 0) delete store[k]; });
    });
  }
  function exercisesFor(levelId){
    if(levelId !== "mixed") return exercisesForLevel(levelId);
    if(!state.mixedSet) newMixedSet();
    return state.mixedSet.map(function(id){ return EXERCISES.filter(function(e){ return e.id === id; })[0]; });
  }
  /* answers in the mix are tracked separately from the Themenbereich views */
  function ansKey(ex){ return (state.level === "mixed" ? "m:" : "") + ex.id; }

  /* ================= keycaps ================= */
  var KEY_WORDS = {menu:1, ctrl:1, home:1, doc:1, enter:1, esc:1, tab:1, var:1, trig:1, shift:1, del:1};
  /* arrow keys drawn as identical SVG triangles (the unicode arrows come in different sizes per font) */
  function arrowSvg(rot){
    return '<svg width="9" height="9" viewBox="0 0 10 10" style="transform:rotate('+rot+'deg)" aria-hidden="true"><path d="M2 1 L8.5 5 L2 9 Z" fill="currentColor"/></svg>';
  }
  var ARROWS = {"►":arrowSvg(0), "▶":arrowSvg(0), "▼":arrowSvg(90), "◄":arrowSvg(180), "◀":arrowSvg(180), "▲":arrowSvg(270)};
  function keys(str){
    var toks = String(str).trim().split(/\s+/);
    var sequential = /^(menu|home|doc)$/i.test(toks[0]);   // menu 6 3 1 = press one after the other
    var out = [];
    toks.forEach(function(t, i){
      if(t === "/" || t === "+"){ out.push('<span class="kplain">'+t+'</span>'); return; }
      if(i > 0 && sequential && out.length && out[out.length-1].indexOf("kplain") === -1) out.push('<span class="ksep">›</span>');
      if(ARROWS[t]){ out.push('<kbd class="key arrow" aria-label="Pfeil">'+ARROWS[t]+'</kbd>'); return; }
      out.push('<kbd class="key'+(KEY_WORDS[t.toLowerCase()] ? ' word' : '')+'">'+t+'</kbd>');
    });
    return '<span class="keyseq">'+out.join('')+'</span>';
  }
  /* keep a bracket or punctuation right before/after a key sequence on the same line: "(menu 6 3 1)." */
  function glueKeys(html){
    return html.replace(/(\(?)(<span class="keyseq">[\s\S]*?<\/kbd><\/span>)([).,;:]*)/g, function(all, open, seq, close){
      return (open || close) ? '<span class="kwrap">'+open+seq+close+'</span>' : seq;
    });
  }
  /* turn key mentions inside the texts into keycaps */
  function keyify(html){
    return glueKeys(keyifyRaw(html));
  }
  function keyifyRaw(html){
    return String(html)
      .replace(/<code>menu<\/code>((?:\s*,?\s*[0-9A-F](?![0-9A-Za-z]))+)/g, function(_, path){
        return keys("menu " + path.replace(/,/g, " "));
      })
      .replace(/<code>((?:ctrl|Home|doc|shift)(?:\s+[^<\s]+)*)<\/code>/g, function(_, k){ return keys(k); })
      .replace(/<code>(menu|enter|esc|tab|var|trig|doc)<\/code>/g, function(_, k){ return keys(k); });
  }

  /* hints are plain text: escape, then turn key mentions into keycaps */
  function hintify(text){
    return glueKeys(escapeHtml(text)
      .replace(/\bmenu((?:\s*,?\s*[0-9A-F](?![0-9A-Za-z]))+)/g, function(_, path){ return keys("menu " + path.replace(/,/g, " ")); })
      .replace(/\bctrl\s+(enter|[^\s,.]+)/g, function(_, k){ return keys("ctrl " + k); })
      .replace(/\bHome((?:\s+\d)+)/g, function(_, d){ return keys("Home" + d); }));
  }

  /* split a theory text at its <h4> headings into collapsible blocks (closed by default) */
  function sectionize(html, level){
    var parts = String(html).split("<h4>");
    var out = parts[0];
    for(var i = 1; i < parts.length; i++){
      var cut = parts[i].indexOf("</h4>");
      var idx = i - 1;
      out += '<details class="sect" data-sec="'+idx+'"'+(state.open[level+":"+idx] ? ' open' : '')+'>'+
               '<summary><span>'+parts[i].slice(0, cut)+'</span></summary>'+
               '<div class="sbody">'+parts[i].slice(cut + 5)+'</div>'+
             '</details>';
    }
    return out;
  }

  /* ================= navigation ================= */
  function openLevel(levelId){
    state.backTo = null;
    if(levelId === "mixed") newMixedSet();
    state.level = levelId;
    state.tab = (levelId !== "mixed" && THEORY[levelId]) ? "theory" : "exercises";
    state.screen = "level";
    window.scrollTo(0, 0);
    render();
  }

  /* ================= search ================= */
  function plainText(html){
    return String(html)
      .replace(/<\/(p|li|div|td|tr|h4|ol|ul|figure|figcaption|span class="in")>|<br\s*\/?>/g," ")
      .replace(/<span class="out">/g," ").replace(/<[^>]+>/g,"")
      .replace(/&nbsp;/g," ").replace(/&middot;/g,"·").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&")
      .replace(/\s+/g," ").trim();
  }
  function normSearch(s){
    return String(s).toLowerCase()
      .replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"ss")
      .replace(/[−–]/g,"-").replace(/·/g,"*");
  }
  var SEARCH_INDEX = null;
  function buildSearchIndex(){
    var idx = [];
    LEVELS.forEach(function(L){
      String(THEORY[L.id]||"").split("<h4>").forEach(function(part, i){
        if(i === 0 && !part.trim()) return;
        var cut = part.indexOf("</h4>");
        var title = cut >= 0 ? plainText(part.slice(0, cut)) : L.title;
        var text = plainText(cut >= 0 ? part.slice(cut+5) : part);
        idx.push({kind:"theory", level:L.id, sec:(i === 0 ? 0 : i-1), title:title, text:text});
      });
    });
    LEVELS.forEach(function(L){
      exercisesForLevel(L.id).forEach(function(ex, i){
        idx.push({kind:"exercise", level:L.id, id:ex.id, title:"Aufgabe "+(i+1), text:plainText(ex.prompt)+" "+ex.hint});
      });
    });
    refRows().forEach(function(r, i){
      idx.push({kind:"ref", row:i, title:plainText(r.label), text:r.keys.replace(/^~/,"").replace(/^@\d+:\d+\|/,"")+" · "+r.group});
    });
    idx.forEach(function(e){ e.hay = normSearch(e.title+" "+e.text); e.hayTitle = normSearch(e.title); });
    return idx;
  }
  function searchEntries(q){
    if(!SEARCH_INDEX) SEARCH_INDEX = buildSearchIndex();
    var words = normSearch(q).trim().split(/\s+/).filter(Boolean);
    if(!words.length) return [];
    var kindRank = {theory:0, ref:1, exercise:2};
    return SEARCH_INDEX.filter(function(e){
      return words.every(function(w){ return e.hay.indexOf(w) !== -1; });
    }).map(function(e){
      var score = kindRank[e.kind]*10;
      words.forEach(function(w){
        if(e.hayTitle.indexOf(w) !== -1) score -= 5;
        /* whole-word / word-start matches rank higher ("esc" the key beats "geschweifte") */
        var re = new RegExp("(^|[^a-z0-9])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
        if(re.test(e.hay)) score -= 6;
      });
      return {e:e, score:score};
    }).sort(function(a, b){ return a.score - b.score; }).slice(0, 20).map(function(x){ return x.e; });
  }
  /* highlight the query words in a piece of plain text (works on the umlaut-folded copy so positions match) */
  function highlight(text, q, maxLen){
    var words = normSearch(q).trim().split(/\s+/).filter(Boolean);
    var folded = normSearch(text);
    var start = 0;
    if(maxLen && text.length > maxLen){
      var first = folded.indexOf(words[0]||"");
      start = Math.max(0, first - 40);
      text = (start > 0 ? "… " : "") + text.slice(start, start + maxLen) + (start + maxLen < text.length ? " …" : "");
      folded = normSearch(text);
    }
    var marks = [];
    words.forEach(function(w){
      var from = 0, at;
      while(w && (at = folded.indexOf(w, from)) !== -1){ marks.push([at, at + w.length]); from = at + w.length; }
    });
    marks.sort(function(a, b){ return a[0] - b[0]; });
    var out = "", pos = 0;
    marks.forEach(function(m){
      if(m[0] < pos) return;
      out += escapeHtml(text.slice(pos, m[0])) + "<mark>" + escapeHtml(text.slice(m[0], m[1])) + "</mark>";
      pos = m[1];
    });
    return out + escapeHtml(text.slice(pos));
  }
  function openHit(e){
    if(e.kind === "ref"){
      state.focus = {type:"ref", row:e.row};
      openReference();
      return;
    }
    state.level = e.level;
    state.tab = e.kind === "theory" ? "theory" : "exercises";
    state.screen = "level";
    state.focus = e.kind === "theory" ? {type:"theory", sec:e.sec} : {type:"exercise", id:e.id};
    render();
  }
  function applyFocus(){
    var f = state.focus;
    state.focus = null;
    if(!f) return;
    var el = null;
    if(f.type === "theory"){
      var d = document.querySelectorAll(".theorypane details.sect")[f.sec];
      if(d){ d.open = true; state.open[state.level+":"+f.sec] = true; el = d.querySelector("summary"); }
    }
    else if(f.type === "exercise"){ el = document.getElementById("card-"+f.id); }
    else if(f.type === "ref"){ el = document.querySelector('tr[data-ref="'+f.row+'"]'); }
    if(!el){ window.scrollTo(0, 0); return; }
    setTimeout(function(){
      var top = el.getBoundingClientRect().top + window.pageYOffset - 16;
      window.scrollTo(0, Math.max(0, top));
      el.classList.add("flash-target");
    }, 30);
  }

  /* ================= render: start screen ================= */
  function renderStart(){
    var app = document.getElementById("app");

    var html = "";
    html += '<header class="apphead"><div class="logo">'+LOGO_SVG+'</div><div>'+
              '<h1 class="appTitle">Nspire-Grundkurs</h1>'+
              '<p class="appSub">TI-Nspire CX II-T CAS &middot; Erklärungen, Übungen und Nachschlagewerk</p>'+
            '</div></header>';

    html += '<div class="searchbox">'+
              '<span class="sicon">'+
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21"/></svg>'+
              '</span>'+
              '<input type="text" inputmode="search" enterkeyhint="search" id="searchInput" placeholder="Suchen, z. B. Varianz, fmax, ctrl t …" autocomplete="off" autocapitalize="off" spellcheck="false" value="'+escapeHtml(state.query).replace(/"/g,"&quot;")+'">'+
              '<button class="sclear" id="searchClear" aria-label="Suche löschen"'+(state.query ? '' : ' hidden')+'>×</button>'+
            '</div>';
    html += '<div id="homeBody"></div>';

    app.innerHTML = html;

    var input = document.getElementById("searchInput");

    });

        if(first){ ev.preventDefault(); first.click(); }
      } else if(ev.key === "Escape"){
        input.value = ""; state.query = ""; clear.hidden = true; renderHomeBody();
      }
    });
    clear.addEventListener("click", function(){
      input.value = ""; state.query = ""; clear.hidden = true; renderHomeBody(); input.focus();
    });
    renderHomeBody();
  }

  function renderHomeBody(){
    var body = document.getElementById("homeBody");
    var q = state.query.trim();
    var html = "";

    if(q){
      var hits = searchEntries(q);
      if(!hits.length){
        html += '<div class="noresults">Nichts gefunden für «'+escapeHtml(q)+'». Versuche ein anderes Stichwort, z. B. einen Befehl wie <code>solve</code> oder ein Thema wie <code>Boxplot</code>.</div>';
      } else {
        html += '<div class="sectionlabel">'+hits.length+' Treffer'+(hits.length === 20 ? ' (die ersten 20)' : '')+'</div>';
        html += '<div class="results">';
        hits.forEach(function(e, i){
          var meta, color;
          if(e.kind === "ref"){ meta = "Nachschlagewerk"; color = "var(--accent)"; }
          else {
            var L = LEVELS.filter(function(x){ return x.id === e.level; })[0];
            meta = L.title + (e.kind === "theory" ? " · Erklärungen" : " · Aufgaben");
            color = L.color;
          }
          html += '<button class="res" style="--dot:'+color+'" data-hit="'+i+'">'+
                    '<div class="rmeta">'+escapeHtml(meta)+'</div>'+

                    (e.text ? '<div class="rsnip">'+highlight(e.text, q, 150)+'</div>' : '')+
                  '</button>';
        });
        html += '</div>';
      }
      body.innerHTML = html;
      Array.prototype.forEach.call(body.querySelectorAll(".res"), function(btn){
        btn.addEventListener("click", function(){ openHit(hits[parseInt(btn.getAttribute("data-hit"),10)]); });
      });
      return;
    }

    html += '<button class="refcard" id="refBtn">'+
              '<span class="ri">📖</span>'+
              '<span class="rtxt"><span class="rt">Nachschlagewerk</span><span class="rs">Alle Tastenwege und Paletten auf einen Blick - auch zum Ausdrucken</span></span>'+
              '<span class="lvl-arrow">›</span>'+
            '</button>';

    html += '<div class="sectionlabel">Themenbereiche</div>';
    html += '<div class="levelgrid">';
    LEVELS.forEach(function(L){
      var n = exercisesForLevel(L.id).length;
      html += '<button class="lvl-btn" style="--dot:'+L.color+'" data-lvl="'+L.id+'">'+
                '<span class="lvl-dot">'+L.id+'</span>'+
                '<span class="lvl-info"><span class="lvl-name">'+L.title+'</span><span class="lvl-desc">'+escapeHtml(L.desc)+'</span><span class="lvl-status">'+n+' Aufgabe'+(n===1?'':'n')+'</span></span>'+
                '<span class="lvl-arrow">›</span>'+
              '</button>';
    });
    html += '</div>';

    body.innerHTML = html;
    Array.prototype.forEach.call(body.querySelectorAll(".lvl-btn"), function(btn){
      btn.addEventListener("click", function(){
        var lvl = btn.getAttribute("data-lvl");
        openLevel(lvl === "mixed" ? "mixed" : parseInt(lvl,10));
      });

  /* ================= render: reference screen ================= */
  function openReference(){
    state.returnTo = state.screen;
    state.screen = "reference";
    if(!state.focus) window.scrollTo(0, 0);
    render();
  }
  /* ================= render: level screen (tabs: Erklärungen / Aufgaben) ================= */
  function sectionTitles(level){
    return String(THEORY[level] || "").split("<h4>").slice(1).map(function(p){ return plainText(p.slice(0, p.indexOf("</h4>"))); });
  }

  function renderLevel(){
    var app = document.getElementById("app");
    var hasTheory = state.level !== "mixed" && !!THEORY[state.level];
    var showTheory = hasTheory && state.tab === "theory";
    var list = exercisesFor(state.level);

               '<button class="reflink" id="refLink">📖 Nachschlagewerk</button></div>';

      html += '<div class="tabbar">'+

      '</div>';

    } else {
      if(state.level === "mixed"){

      }

    var backTask = document.getElementById("backTask");

      render();

    if(showTheory){
      var sects = app.querySelectorAll("details.sect");
      var toggleAll = document.getElementById("toggleAll");

        toggleAll.textContent = allOpen ? "Alle zuklappen" : "Alle aufklappen";
        toggleAll.setAttribute("data-open", allOpen ? "1" : "0");
      };
      Array.prototype.forEach.call(sects, function(d){
        d.addEventListener("toggle", function(){
          state.open[state.level+":"+d.getAttribute("data-sec")] = d.open;
          updateToggle();
        });
      });
      toggleAll.addEventListener("click", function(){
        var open = toggleAll.getAttribute("data-open") !== "1";
        Array.prototype.forEach.call(sects, function(d){ d.open = open; state.open[state.level+":"+d.getAttribute("data-sec")] = open; });
        updateToggle();

  /* ---------- back to exercise, exercise cards ---------- */
  function inst(ex){
    var v = state.variants[ansKey(ex)];
    if(!v) return ex;
    var o = {}; Object.keys(ex).forEach(function(k){ o[k] = ex[k]; });
    Object.keys(v).forEach(function(k){ o[k] = v[k]; });
    return o;
  }
  function cardHtml(ex, i){
    var e = inst(ex), key = ansKey(ex);
    var solved = !!state.answers[key], tries = state.tries[key] || 0, revealed = !!state.revealed[key];
    var topic = state.level === "mixed" ? ' · '+escapeHtml(levelTitle(ex.level)) : '';
    var h = '<div class="qcard'+(solved?' solved':'')+'" id="card-'+ex.id+'" data-num="'+i+'">';
    h += '<div class="qhead"><div class="qbadge">Aufgabe '+(i+1)+topic+(solved?' <span class="check">✓ gelöst</span>':'')+'</div>'+
         (ex.gen ? '<button class="qnew" data-act="new" title="Gleiche Aufgabe mit neuen Zahlen">🔁 Neue Zahlen</button>' : '')+'</div>';
    h += '<p class="qtext">'+keyify(e.prompt)+'</p>';
    h += '<div class="qrow">'+
      '<input type="text" id="ans-'+ex.id+'" placeholder="'+(e.type==="numeric"?"Zahl eintragen...":"Antwort eintragen...")+'" autocomplete="off" autocapitalize="off" spellcheck="false"'+(solved?' disabled':'')+'>'+
      '<button class="cta" data-act="check"'+(solved?' disabled':'')+'>Prüfen</button>'+
    '</div>';
    h += '<div class="qlinks"><button class="linklike" data-act="hint">Tipp</button>'+
         (ex.sec ? '<button class="linklike" data-act="theory">📘 Zur Erklärung</button>' : '')+'</div>';
    h += '<div class="hintbox" hidden></div>';
    var fb = '';
    if(solved){
      fb = '<span class="tag-good">Richtig!</span><span class="explain">Lösung: '+escapeHtml(e.solution)+'</span>';
    } else if(revealed){
      fb = '<span class="tag-sol">Lösung</span><span class="explain">'+escapeHtml(e.solution)+'</span>';
    } else if(tries >= 2){
      fb = '<button class="cta secondary small" data-act="reveal">Lösung zeigen</button>';
    }
    h += '<div class="feedback'+(fb?' show':'')+'">'+fb+'</div>';
    return h + '</div>';
  }
  function bindCard(ex){
    var card = document.getElementById("card-"+ex.id);
    if(!card) return;
    var input = card.querySelector("input");
    input.addEventListener("keydown", function(ev){
      if(ev.key === "Enter"){ ev.preventDefault(); checkExercise(ex); }
    });
    card.addEventListener("click", function(ev){
      var t = ev.target.closest ? ev.target.closest("[data-act]") : null;
      if(!t) return;
      var act = t.getAttribute("data-act");
      if(act === "check") checkExercise(ex);
      else if(act === "hint"){
        var box = card.querySelector(".hintbox");
        box.hidden = !box.hidden;
        box.innerHTML = "<strong>Tipp:</strong> " + hintify(inst(ex).hint);
      }
      else if(act === "reveal"){ state.revealed[ansKey(ex)] = true; refreshCard(ex); }
      else if(act === "new"){
        var key = ansKey(ex);
        state.variants[key] = sanitizeVariant(ex.gen());
        delete state.answers[key]; delete state.tries[key]; delete state.revealed[key];
        refreshCard(ex, true);
      }
      else if(act === "theory") goToTheory(ex);
    });
  }
  function refreshCard(ex, focusInput){
    var card = document.getElementById("card-"+ex.id);
    if(!card) return;
    var wrap = document.createElement("div");
    wrap.innerHTML = cardHtml(ex, parseInt(card.getAttribute("data-num"), 10));
    var fresh = wrap.firstChild;
    card.parentNode.replaceChild(fresh, card);
    bindCard(ex);
    if(focusInput){ fresh.classList.add("flash-target"); var inp = fresh.querySelector("input"); if(inp) inp.focus(); }
  }
  function sanitizeVariant(v){
    if(v.correct && v.traps){
      var tol = v.tol || 0.01;
      v.traps = v.traps.filter(function(t){
        return !(t.vals && t.vals.length === v.correct.length &&
                 t.vals.every(function(x, i){ return Math.abs(x - v.correct[i]) < Math.max(tol, t.tol || 0); }));
      });
    }
    return v;
  }
  function goToTheory(ex){
    var titles = sectionTitles(ex.level), idx = titles.indexOf(ex.sec);
    state.backTo = {level:state.level, id:ex.id};
    state.level = ex.level;
    state.tab = "theory";
    state.focus = idx >= 0 ? {type:"theory", sec:idx} : null;
    window.scrollTo(0, 0);
    render();
  }

  /* correct? otherwise, does the input match a typical mistake? */
  function trapMatches(e, raw, t){
    if(t.text) return checkTextAnswer(raw, t.text);
    return checkNumericAnswer(raw, t.vals, t.tol || e.tol || 0.01);
  }
  function evaluateAnswer(e, raw){
    var ok = checkAnswer(e, raw);
    if(ok && e.forbid && trapMatches(e, raw, e.forbid)) return {ok:false, msg:e.forbid.msg};
    if(ok) return {ok:true};
    var hit = (e.traps || []).filter(function(t){ return trapMatches(e, raw, t); })[0];
    return {ok:false, msg:hit ? hit.msg : null};
  }

  function checkExercise(ex){
    var card = document.getElementById("card-"+ex.id);
    var input = card.querySelector("input");
    if(!input.value.trim()) return;
    var e = inst(ex), key = ansKey(ex);
    var res = evaluateAnswer(e, input.value);
    var fb = card.querySelector(".feedback");
    fb.classList.add("show");

    if(res.ok){
      state.answers[key] = true;
      refreshCard(ex);
      return;
    }
    state.tries[key] = (state.tries[key] || 0) + 1;
    card.classList.add("flash-bad");
    setTimeout(function(){ card.classList.remove("flash-bad"); }, 600);
    var msg = res.msg ? hintify(res.msg) : "Versuch es nochmal.";
    var extra = "";
    if(state.revealed[key]){
      extra = '<span class="explain sol"><strong>Lösung:</strong> '+escapeHtml(e.solution)+'</span>';
    } else if(state.tries[key] >= 2){
      extra = '<div class="feedback-actions"><button class="cta secondary small" data-act="reveal">Lösung zeigen</button></div>';
    }
    fb.innerHTML = '<span class="tag-bad">Nicht ganz.</span><span class="explain">'+msg+'</span>'+extra;
  }

  /* ================= print ================= */
  var printOpened = [];
  if(typeof window !== "undefined" && typeof window.addEventListener === "function"){
    window.addEventListener("beforeprint", function(){
      printOpened = [];
      Array.prototype.forEach.call(document.querySelectorAll("details.sect"), function(d){ if(!d.open){ d.open = true; printOpened.push(d); } });
    });
    window.addEventListener("afterprint", function(){
      printOpened.forEach(function(d){ d.open = false; });
      printOpened = [];
    });
  }

  /* ================= Nachschlagewerk: general keys, key paths per Themenbereich, palettes ================= */
  var REF_GENERAL = [
    {t:"Allgemeine Tasten", rows:[["Rechner ein / Home-Bildschirm","Home"],["Rechner ausschalten","ctrl Home"],["Menü der Applikation","menu"],
        ["Kontextmenü (wie rechte Maustaste)","ctrl menu"],["berechnen, Gleichung lösen","enter"],["Resultat approximiert","ctrl enter"],
        ["Aktion abbrechen / rückgängig","esc / ctrl esc"],["Eingabezeile in Graphs ein/aus","tab"],
        ["Term markieren","shift + Pfeile"],["ausschneiden / kopieren / einfügen","ctrl x / c / v"],["rückgängig","ctrl z"]]},
    {t:"Eingeben", rows:[["Mathbox in Notes","ctrl m"],["Zuweisung := (speichern)","ctrl :="],["geschweifte Klammern { }","ctrl )"],
        ["Ungleichheitszeichen und |","ctrl ="],["mathematische Vorlagen (neben der 9)","Vorlagen-Taste"],["sin, cos, tan …","trig"],
        ["gespeicherte Variablen","var"],["alle Befehle (Buch-Symbol)","Lexikon"]]}
  ];
  var SPICK = [
    {lvl:1, rows:[["Dokumenteinstellungen","Home 5 2"],["Eigene Dateien","Home 2"],["neues Dokument","ctrl n"],["neue Seite","ctrl i"],
                  ["neues Problem","doc 4 1"],["Seiten wechseln","ctrl ◄ / ctrl ►"],["Seitensortierer","ctrl ▲"],["speichern","ctrl s"]]},
    {lvl:2, rows:[["Variable löschen (delvar)","menu 6 1 2"],["ausmultiplizieren (expand)","menu 6 3 3"],["faktorisieren (factor)","menu 6 3 2"]]},
    {lvl:3, rows:[["Gleichung lösen (solve)","menu 6 3 1"],["Gleichungssystem","menu 6 3 7 1"],
                  ["Lösung speichern (right)","menu 6 3 D 2"],["zeros","menu 6 3 4"]]},
    {lvl:4, rows:[["Winkelmass Grad / Bogenmass wechseln","~oben rechts direkt auf DEG / RAD klicken"],["Bedingungsstrich | und &lt; &gt;","ctrl ="],["sin, cos, tan und Umkehrfunktionen","trig"]]},
    {lvl:5, rows:[["Nullstellen (zeros)","menu 6 3 4"],["Minimum (fmin)","menu 6 4 7"],["Maximum (fmax)","menu 6 4 8"],["Graphs: Fenster/Zoom","menu 4"],
                  ["Graphs: Wertetabelle","ctrl t"],["Graphs: Nullstelle","menu 6 1"],["Graphs: Maximum","menu 6 2"],["Graphs: Schnittpunkt","menu 6 4"]]},
    {lvl:6, rows:[["<strong>Daten erfassen</strong> (Lists &amp; Spreadsheet)","@6:0|→ Themenbereich 6"],["Werte auflisten (freqTable▶list)","Lexikon"],["Statistik mit einer Variablen","menu 6 6 1 1"],["Statistik-Resultate abrufen","var"]]},
    {lvl:7, rows:[["<strong>Daten erfassen</strong> (Lists &amp; Spreadsheet)","@6:0|→ Themenbereich 6"],["Histogramm","menu 1 3"],["Säulenbreite","menu 2 2 2 1"],["Prozent auf der y-Achse","menu 2 2 1 2"],["Boxplot","menu 1 2"]]},
    {lvl:8, rows:[["Vektor/Matrix eingeben","Vorlagen-Taste"],["Betrag (norm)","menu 6 7 7"],["Einheitsvektor (unitV)","menu 6 7 C 1"],["Skalarprodukt (dotP)","menu 6 7 C 3"],["Zwischenwinkel: cos⁻¹","trig"]]}
  ];
  /* all rows in display order (for the search index and for jumping to a row) */
  function refKeys(k){
    if(k.charAt(0) === "@"){ var m = k.match(/^@(\d+):(\d+)\|(.*)$/);
      return '<button class="seelink" data-lvl="'+m[1]+'" data-sec="'+m[2]+'">'+m[3]+'</button>'; }
    return k.charAt(0) === "~" ? '<span class="kplain">'+k.slice(1)+'</span>' : keys(k); }
  function refRows(){
    var out = [];
    REF_GENERAL.forEach(function(g){ g.rows.forEach(function(r){ out.push({group:g.t, label:r[0], keys:r[1]}); }); });
    SPICK.forEach(function(g){ var L = LEVELS.filter(function(x){ return x.id === g.lvl; })[0];
      g.rows.forEach(function(r){ out.push({group:L.title, label:r[0], keys:r[1]}); }); });
    return out;
  }
  function renderReference(){
    var app = document.getElementById("app");
    var back = state.returnTo === "level" ? "‹ Zurück zu " + levelTitle(state.level) : "‹ Menü";
    var html = '<div class="backbar"><button class="cta secondary" id="backBtn">'+back+'</button>'+
               '<span class="tools-r">'+pdfLink("ref").replace('class="pdflink"','class="reflink pdflink"')+'</span></div>';
    html += '<div class="spickhead"><div class="logo">'+LOGO_SVG+'</div><div><div class="levelheader">Nachschlagewerk</div>'+
            '<div class="appSub">TI-Nspire CX II-T CAS &middot; Nspire-Grundkurs</div></div></div>';
    var n = 0;
    var box = function(title, color, num, rows){
      var h = '<section class="spbox" style="--dot:'+color+'"><h3>'+(num ? '<span class="lvl-dot sm">'+num+'</span>' : '')+escapeHtml(title)+'</h3><table>';
      rows.forEach(function(r){ h += '<tr data-ref="'+(n++)+'"><td>'+r[0]+'</td><td>'+refKeys(r[1])+'</td></tr>'; });
      return h + '</table></section>';
    };
    html += '<div class="sectionlabel">Allgemein</div><div class="spick gen">';
    REF_GENERAL.forEach(function(g){ html += box(g.t, "#6b7285", null, g.rows); });
    html += '</div>';
    html += '<div class="sectionlabel spsec">Tastenwege nach Themenbereich</div><div class="spick">';
    SPICK.forEach(function(g){ var L = LEVELS.filter(function(x){ return x.id === g.lvl; })[0]; html += box(L.title, L.color, L.id, g.rows); });
    html += '</div>';
    html += '<div class="sectionlabel spsec refpal">Paletten</div><div class="palrow refpal">'+
              '<figure class="fig"><img src="images/img_058.png" alt="Vorlagen-Palette"><figcaption>Vorlagen-Taste (neben der 9): mathematische Vorlagen</figcaption></figure>'+
              ineqPalette(0, 'ctrl = : Ungleichheitszeichen und Bedingungsstrich')+
              trigPalette()+
            '</div>';
    app.innerHTML = html;
    document.getElementById("backBtn").addEventListener("click", function(){
      state.screen = state.returnTo === "level" ? "level" : "start";
      render();
    });
    Array.prototype.forEach.call(app.querySelectorAll(".seelink"), function(b){
      b.addEventListener("click", function(){ openHit({kind:"theory", level:parseInt(b.getAttribute("data-lvl"),10), sec:parseInt(b.getAttribute("data-sec"),10)}); });
    });
  }

  /* ================= master render ================= */
  function render(){
    if(state.screen === "start"){ renderStart(); }
    else if(state.screen === "level"){ renderLevel(); }
    else if(state.screen === "reference"){ renderReference(); }
    applyFocus();
  }

  render();
})();
</script>
